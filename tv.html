<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poker Night TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
/* 1rem is the size unit for this screen: 1% of the height on a 16:9 TV, and smaller on narrower
   screens so nothing runs off the side. Portrait screens get a stacked layout (bottom of this block). */
html{font-size:min(1vh,.6vw)}
body{overflow:hidden;font-size:16px}
.tv{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:2rem;padding:2.6rem 3vw 3rem}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:1rem 2rem}
.brand{display:flex;align-items:baseline;gap:1.2rem;min-width:0;flex:1 1 auto}
.brand .suits{font-size:2.4rem;letter-spacing:.3em}
.brand .lg{font-size:3.8rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .round{color:var(--muted);font-size:2.4rem;white-space:nowrap}
.top-right{display:flex;align-items:center;gap:1.4rem;min-width:0;margin-left:auto}
.conn{color:var(--muted);font-size:1.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.conn .dot{display:inline-block;width:1rem;height:1rem;border-radius:50%;background:var(--rose);margin-right:.7rem;vertical-align:middle}
.conn.on .dot{background:var(--brass)}
.top-btn{flex:none;font-size:1.9rem;padding:.9rem 1.4rem}
/* Buttons, status and pointer fade out while nobody touches the TV, unless something needs doing. */
.top-right{transition:opacity .6s}
body.idle:not(.alert) .top-right{opacity:0;pointer-events:none}
body.idle{cursor:none}
:fullscreen .fs{display:none}
.ctl-panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,94vw);z-index:20;display:none;flex-direction:column;
  background:var(--bg2);border-left:1px solid var(--line);box-shadow:-12px 0 30px rgba(0,0,0,.45)}
.ctl-panel.on{display:flex}
.ctl-panel .bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-size:18px}
.ctl-panel .bar .btn{font-size:14px;padding:7px 14px}
.ctl-panel iframe{flex:1;width:100%;border:0;background:var(--bg2)}

.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(24rem,25vw);gap:3vw;min-height:0}
.clockbox{display:flex;align-items:center;justify-content:center;min-height:0;min-width:0;overflow:hidden}
/* Scaled down by fit() when lots of player cards leave the clock less room. */
.clockin{display:flex;flex-direction:column;align-items:center;text-align:center;flex:none;text-shadow:0 .3rem 2.4rem rgba(0,0,0,.75),0 .1rem .4rem rgba(0,0,0,.6)}
.top{text-shadow:0 .2rem 1rem rgba(0,0,0,.7)}

/* Background: the group's photos, GTA loading-screen style. Each one fades in and drifts slowly
   (moved by JS), colours punched up, under a dark green tint so the clock stays readable. */
.tv{position:relative}
.bg{position:fixed;inset:0;overflow:hidden;background:linear-gradient(180deg,var(--bg1),var(--bg2))}
.bg-img{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease}
.bg-img.on{opacity:1}
.bg-img img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;filter:saturate(1.7) contrast(1.3) brightness(1.05);will-change:transform}
.bg-img img.panel{transform-origin:50% 50%;box-shadow:0 0 8rem rgba(0,0,0,.75)}
.bg-img canvas{position:absolute;inset:0;width:100%;height:100%;filter:saturate(1.5) brightness(.75)}
.bg-tone{position:absolute;inset:0;background:
  radial-gradient(ellipse at 50% 45%,transparent 35%,rgba(4,12,10,.6) 100%),
  linear-gradient(180deg,rgba(15,38,32,.25),rgba(15,38,32,.45) 45%,rgba(15,38,32,.75))}
.lvl{font-size:4rem;color:var(--muted)}
.lvl .paused{display:none;font-family:Inter,sans-serif;font-size:2.2rem;font-weight:600;color:var(--rose);border:1px solid var(--rose);border-radius:999px;padding:.3rem 1.2rem;margin-left:1.2rem;vertical-align:middle;letter-spacing:.08em;text-transform:uppercase}
.lvl .paused.on{display:inline-block}
.time{font-weight:600;font-variant-numeric:tabular-nums;font-size:min(15vw,28rem);line-height:1;letter-spacing:-.01em;margin:1.2rem 0 2.4rem;white-space:nowrap}
.time.paused{color:#B9C9C0}
.time.final{font-family:Fraunces,Georgia,serif;font-weight:500;color:var(--brass);font-size:min(9vw,16rem)}
.blinds{display:flex;align-items:baseline;gap:1.4rem}
.blinds .lab,.next .lab{font-size:2.4rem;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.blinds .big{font-family:Fraunces,Georgia,serif;font-size:10rem;color:var(--brass);line-height:1;white-space:nowrap}
.next{font-size:3.4rem;margin-top:2rem;display:flex;align-items:baseline;gap:1rem;font-variant-numeric:tabular-nums}
.next .dur{color:var(--muted);font-size:2.4rem}
.note{font-size:2.5rem;color:var(--muted);margin-top:1rem}

.side{display:flex;flex-direction:column;gap:2rem;min-height:0;min-width:0}
.card{background:rgba(24,53,46,.86);border:1px solid var(--line);border-radius:1.6rem;padding:1.6rem}
.stand{flex:1;min-height:0;min-width:0;overflow:hidden}
.side-h{font-family:Fraunces,Georgia,serif;font-size:2.7rem;margin-bottom:1rem}
/* Font size set by fit() so every player's row fits in the box. */
.stand ol{list-style:none;margin:0;padding:0;font-size:2.3rem}
.stand li{display:grid;grid-template-columns:1.3em minmax(0,1fr) auto;gap:.5em;align-items:center;padding:.24em 0;border-top:1px solid var(--line-soft)}
.stand li:first-child{border-top:0}
.stand .rk{color:var(--muted);font-variant-numeric:tabular-nums}
.stand .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stand .pt{font-weight:600;font-variant-numeric:tabular-nums}
.stand li.lead .rk,.stand li.lead .pt{color:var(--brass)}
.stand li.wait{display:block;color:var(--muted);font-size:2.2rem}
.stand ol.two{column-count:2;column-gap:1.4em} .stand ol.two li{break-inside:avoid}
.join{display:flex;gap:1.4rem;align-items:center}
.qr{width:14rem;height:14rem;flex:none;background:var(--cream);padding:1rem;border-radius:1rem}
.qr svg{display:block;width:100%;height:100%}

/* fit() picks the columns (--cols, --rows) for the number of players and the width of the screen. */
.players{display:grid;grid-template-columns:repeat(var(--cols,7),minmax(0,1fr));gap:1.2rem;--ah:calc(5rem + 11rem / var(--rows,1))}
.pc{background:rgba(24,53,46,.86);border:1px solid var(--line);border-radius:1.6rem;padding:1.2rem;text-align:center;position:relative;min-width:0}
.pc .avatar{height:var(--ah);border-radius:1.1rem;font-size:calc(var(--ah) / 2)}
.pc .nm{font-size:2.6rem;font-weight:600;margin-top:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .sub{font-size:1.9rem;color:var(--muted);min-height:1.5em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .sub b{color:var(--cream);font-weight:600}
.pc.out{background:rgba(15,38,32,.92)}
.pc.out .avatar{filter:grayscale(1) brightness(.5)}
.pc.out .nm{color:var(--muted)}
.pc .stamp{position:absolute;top:calc(1.2rem + var(--ah) / 2);left:50%;transform:translate(-50%,-50%) rotate(-10deg);font-weight:600;font-size:min(4.6rem,calc(var(--cw,30rem) * .17));line-height:1.1;letter-spacing:.14em;color:var(--rose);border:.45rem solid var(--rose);border-radius:1rem;padding:.2rem 1.4rem;background:rgba(15,38,32,.6)}
.pc.win{border-color:var(--brass);background:rgba(203,168,106,.12)}
.pc .crown{position:absolute;top:.2rem;right:1.2rem;color:var(--brass);font-size:4.4rem;text-shadow:0 .3rem 1rem rgba(0,0,0,.5)}
.players .empty{grid-column:1/-1;text-align:center;color:var(--muted);font-size:2.8rem;padding:5rem 0}

/* Portrait or near-square screens: clock on top, standings and QR side by side, players below. */
@media (max-aspect-ratio:1/1){
  html{font-size:min(1vw,.55vh)}
  .stage{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(26rem,1fr);gap:3rem}
  .time{font-size:min(24vw,30rem)}
  .time.final{font-size:min(14vw,16rem)}
  .side{flex-direction:row}
  .join{flex-direction:column;justify-content:center;text-align:center;flex:none;width:30%}
  .qr{width:min(18rem,100%);height:auto;aspect-ratio:1}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="bg-img"></div><div class="bg-img"></div><div class="bg-tone"></div></div>
<div class="tv">
  <header class="top">
    <div class="brand">
      <span class="suits"><span class="b">&#9824;</span><span class="r">&#9829;</span><span class="r">&#9830;</span><span class="b">&#9827;</span></span>
      <span class="lg serif" id="leagueName">Poker Night</span>
      <span class="round" id="round"></span>
    </div>
    <div class="top-right">
      <span class="conn" id="conn"><span class="dot"></span><span id="connText">Connecting&hellip;</span></span>
      <button class="btn ghost top-btn" id="ctlBtn">Controls</button>
      <button class="btn ghost top-btn fs" id="fsBtn">&#x26F6; Fullscreen</button>
    </div>
  </header>
  <main class="stage">
    <div class="clockbox" id="clockbox"><div class="clockin" id="clockin">
      <div class="lvl serif"><span id="lvl">Level 1</span><span class="paused" id="paused">Paused</span></div>
      <div class="time" id="time">30:00</div>
      <div class="blinds"><span class="lab">Blinds</span><span class="big" id="blinds">5 / 1</span></div>
      <div class="next" id="next"></div>
      <div class="note" id="note"></div>
    </div></div>
    <aside class="side">
      <div class="card stand"><div class="side-h">Standings</div><ol id="stand"></ol></div>
      <div class="card join">
        <div class="qr" id="qr"></div>
        <div class="side-h">Scan to control</div>
      </div>
    </aside>
  </main>
  <section class="players" id="players"></section>
</div>
<!-- The phone remote, run on this screen: works with no internet and no phone. -->
<aside class="ctl-panel" id="ctlPanel">
  <div class="bar"><span class="serif">Controls</span><button class="btn ghost" id="ctlClose">Close</button></div>
</aside>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="league.js"></script>
<script src="sync.js"></script>
<script>
(function(){
  "use strict";
  var L=League, ROOM_KEY="pokerLeague.tvRoom", CACHE_KEY="pokerLeague.tv.v1";
  function get(k){ try{return localStorage.getItem(k);}catch(e){return null;} }
  function set(k,v){ try{localStorage.setItem(k,v);}catch(e){} }
  function $(id){ return document.getElementById(id); }

  // The room code stays the same across refreshes so phones can find the TV again.
  var room=get(ROOM_KEY); if(!room){ room=Sync.newRoomCode(); set(ROOM_KEY,room); }
  // Display copy only; the phones hold the real data and resend it when they reconnect.
  var state=null; try{ state=JSON.parse(get(CACHE_KEY)); }catch(e){}

  var conn={status:"connecting",phones:0}, awake=false;
  Sync.host(room,{
    initial:state,
    onState:function(s){ state=s; set(CACHE_KEY,JSON.stringify(s)); render(); },
    onStatus:function(s,n){ conn.status=s; conn.phones=n; paintConn(); }
  });

  // ---- join code ----
  var joinUrl=new URL("remote.html?room="+room,location.href).href;
  var qr=qrcode(0,"M"); qr.addData(joinUrl); qr.make();
  $("qr").innerHTML=qr.createSvgTag({cellSize:4,margin:0,scalable:true});

  function paintConn(){
    var t;
    if(conn.status==="ready") t=conn.phones?(conn.phones+(conn.phones===1?" phone":" phones")+" connected"):"Waiting for a phone";
    else t=conn.status==="reconnecting"?"Reconnecting…":"Connecting…";
    if(awake) t+=" · screen stays awake";
    if(!ac) t+=" · tap the screen to turn on sound";
    $("connText").textContent=t;
    $("conn").classList.toggle("on",conn.status==="ready"&&conn.phones>0);
    document.body.classList.toggle("alert",conn.status!=="ready"||!ac);
  }
  var idleTimer=null;
  function wake(){
    document.body.classList.remove("idle"); clearTimeout(idleTimer);
    idleTimer=setTimeout(function(){ document.body.classList.add("idle"); },4000);
  }
  ["mousemove","mousedown","touchstart","keydown"].forEach(function(t){ document.addEventListener(t,wake,{passive:true}); });
  wake();

  // ---- render ----
  function render(){
    var lg=state&&state.league;
    $("leagueName").textContent=lg?lg.leagueName:"Poker Night";
    renderStandings(lg);
    renderPlayers(lg);
    paintClock();
    fit();
  }
  // Fit the screen, whatever its shape: player cards in one row when they're wide enough, otherwise
  // in even rows; the standings text shrinks until every player's row fits in the box (two columns
  // rather than unreadably small); the clock scales down to the room the cards leave it.
  function fit(){
    var u=parseFloat(getComputedStyle(document.documentElement).fontSize);
    var box=$("players"), n=box.querySelectorAll(".pc").length;
    if(n){
      var gap=1.2*u, W=box.clientWidth;
      var cols=Math.max(1,Math.min(n,Math.floor((W+gap)/(13*u+gap)))), rows=Math.ceil(n/cols);
      cols=Math.ceil(n/rows);
      box.style.setProperty("--cols",cols); box.style.setProperty("--rows",rows);
      box.style.setProperty("--cw",(W-gap*(cols-1))/cols+"px");
    }
    var ol=$("stand"), card=ol.parentNode;
    ol.style.fontSize=""; ol.classList.remove("two");
    var room=card.getBoundingClientRect().bottom-parseFloat(getComputedStyle(card).paddingBottom)-ol.getBoundingClientRect().top;
    var base=parseFloat(getComputedStyle(ol).fontSize);
    if(room>0&&ol.scrollHeight>room){
      if(base*room/ol.scrollHeight<1.6*u) ol.classList.add("two");
      if(ol.scrollHeight>room) ol.style.fontSize=base*room/ol.scrollHeight+"px";
    }
    var cb=$("clockbox"), ci=$("clockin");
    ci.style.transform="";
    var k=Math.min(1,cb.clientHeight/ci.offsetHeight,cb.clientWidth/ci.offsetWidth);
    if(k<1) ci.style.transform="scale("+k+")";
  }
  window.addEventListener("resize",fit);
  if(document.fonts) document.fonts.ready.then(fit);
  function renderStandings(lg){
    var ol=$("stand"); ol.innerHTML="";
    if(!lg){ ol.innerHTML='<li class="wait">Waiting for a phone to connect&hellip;</li>'; return; }
    L.standings(lg).forEach(function(r,i){
      var li=document.createElement("li"); if(i===0&&r.played>0) li.className="lead";
      li.innerHTML='<span class="rk">'+(i+1)+'</span><span class="nm">'+L.esc(r.name)+'</span><span class="pt">'+L.fmt(r.total)+'</span>';
      ol.appendChild(li);
    });
  }
  function renderPlayers(lg){
    var box=$("players"); box.innerHTML=""; $("round").textContent="";
    if(!lg){ box.innerHTML='<div class="empty">Scan the code with your phone to run the clock from your seat.</div>'; return; }
    var night=state.night, v=night?L.nightView(night):null;
    var ids=night?night.playing:lg.players.map(function(p){return p.id;});
    if(night) $("round").textContent="Round "+night.round+" of "+L.ROUNDS+(v.done?"":" · "+v.alive.length+" of "+ids.length+" left");
    ids.forEach(function(pid){
      var p=lg.players.filter(function(x){ return x.id===pid; })[0]||{name:L.playerName(lg,night,pid)};
      var photo=state.photos&&state.photos[pid]&&state.photos[pid].d;
      var i=v?v.info[pid]:{entries:1,out:false,place:null,kos:0}, win=!!v&&v.winner===pid;
      var bits=[];
      if(p.guest) bits.push("Guest");
      if(i.out&&i.place) bits.push(L.ordinal(i.place));
      else if(win) bits.push("Winner");
      else if(!i.out&&i.entries>1) bits.push("2nd entry");
      if(i.kos) bits.push("<b>"+i.kos+"</b> KO");
      var c=document.createElement("div"); c.className="pc"+(i.out?" out":"")+(win?" win":"");
      c.innerHTML=L.avatar(p.name,photo)+'<div class="nm">'+L.esc(p.name)+'</div><div class="sub">'+bits.join(" · ")+'</div>'+
        (i.out?'<div class="stamp">OUT</div>':'')+(win?'<div class="crown">&#9819;</div>':'');
      box.appendChild(c);
    });
  }

  // ---- clock ----
  var lastLevel=null;
  function paintClock(){
    var c=(state&&state.clock)||L.newClock(), v=L.clockAt(c,Date.now()), lv=L.LEVELS[v.i], nx=L.LEVELS[v.i+1];
    if(lastLevel!==null&&v.i>lastLevel) beep();
    var refit=lastLevel!==v.i;
    lastLevel=v.i;
    $("lvl").textContent="Level "+(v.i+1);
    $("paused").classList.toggle("on",!v.running&&!v.final&&v.remaining!==lv.mins*60);
    var t=$("time");
    if(v.final){ t.textContent="Final level"; t.className="time final"; }
    else { t.textContent=L.fmtClock(v.remaining); t.className="time"+(v.running?"":" paused"); }
    $("blinds").textContent=lv.big+" / "+lv.small;
    $("next").innerHTML=nx?'<span class="lab">Next</span><span>'+nx.big+" / "+nx.small+'</span><span class="dur">'+(nx.mins!=null?nx.mins+" min":"to the finish")+'</span>':"";
    $("note").textContent=lv.note;
    if(refit) fit(); // "Final level" and the next-level line change the clock's size
  }
  setInterval(paintClock,250);

  // ---- background slideshow ----
  // backgrounds/list.json names the photos in backgrounds/: already cropped to 16:9 around the faces and
  // AI-upscaled to 1920x1080. They play in a shuffled loop, each drifting with a slow zoom. On a landscape
  // screen they fill it; on a portrait one each is shown whole, smaller, over a blurred copy of itself.
  var SLIDE_MS=9000, FADE_MS=1600;
  var bgLayers=document.querySelectorAll(".bg-img"), bgList=[], bgAt=0, bgFront=0, bgTimer=null, bgFails=0;
  var still=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  fetch("backgrounds/list.json").then(function(r){ return r.ok?r.json():[]; }).then(function(list){
    bgList=list.slice();
    for(var i=bgList.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=bgList[i]; bgList[i]=bgList[j]; bgList[j]=t; }
    if(bgList.length) nextBg();
  }).catch(function(){});
  function nextBg(){
    clearTimeout(bgTimer);
    if(document.hidden){ bgTimer=setTimeout(nextBg,SLIDE_MS); return; }
    var img=new Image(); img.alt="";
    img.onload=function(){ bgFails=0; showBg(img); bgTimer=setTimeout(nextBg,SLIDE_MS); };
    img.onerror=function(){ if(++bgFails<bgList.length) bgTimer=setTimeout(nextBg,200); };
    img.src="backgrounds/"+encodeURIComponent(bgList[bgAt]);
    bgAt=(bgAt+1)%bgList.length;
  }
  function showBg(img){
    bgFront=1-bgFront;
    var layer=bgLayers[bgFront], W=innerWidth, H=innerHeight, A=W/H, a=img.naturalWidth/img.naturalHeight, r=Math.random;
    var w, h, from, to, zoomIn=r()<.5;
    layer.innerHTML="";
    if(a/A>.7&&a/A<1.45){
      var tall=a<A; w=tall?W*1.04:H*1.04*a; h=tall?w/a:H*1.04;
      // Any position between (W-w, H-h) and (0, 0) keeps the screen covered, and zooming in from the top-left corner never opens a gap.
      var dx=W-w, dy=H-h;
      from=[dx*r(),dy*r()]; to=[dx-from[0],dy-from[1]];
    } else {
      layer.appendChild(blurCopy(img,A));
      img.className="panel";
      // Three quarters of the screen's height (or width), never more than the photo's own size.
      var k=Math.min(1,a<A?H*.75/img.naturalHeight:W*.75/img.naturalWidth);
      w=img.naturalWidth*k; h=img.naturalHeight*k;
      var x=(W-w)*(.15+.7*r()), y=(H-h)*.45, d=(r()<.5?-1:1);
      from=[x,y]; to=a<A?[x+d*W*.03,y]:[x,y+d*H*.03];
    }
    img.style.width=w+"px"; img.style.height=h+"px";
    var move=function(p,s){ return "translate("+p[0]+"px,"+p[1]+"px) scale("+s+")"; };
    layer.appendChild(img);
    if(!still&&img.animate) img.animate([{transform:move(from,zoomIn?1:1.03)},{transform:move(to,zoomIn?1.03:1)}],
      {duration:SLIDE_MS+FADE_MS*2,easing:"ease-in-out",fill:"forwards"});
    else img.style.transform=move(from,1);
    layer.classList.add("on"); bgLayers[1-bgFront].classList.remove("on");
  }
  // The screen-filling blurred copy: the photo drawn tiny, then stretched, which blurs it for free.
  function blurCopy(img,A){
    var c=document.createElement("canvas"), x=c.getContext("2d"), sw=img.naturalWidth, sh=img.naturalHeight;
    c.width=48; c.height=Math.max(1,Math.round(48/A));
    if(sw/sh>A) sw=sh*A; else sh=sw/A;
    if("filter" in x) x.filter="blur(1.5px)";
    x.drawImage(img,(img.naturalWidth-sw)/2,(img.naturalHeight-sh)*.3,sw,sh,0,0,c.width,c.height);
    return c;
  }
  // A new screen size (turning the TV, leaving fullscreen) needs the photo laid out again.
  var bgResize=null;
  window.addEventListener("resize",function(){ if(!bgList.length) return; clearTimeout(bgResize); bgResize=setTimeout(nextBg,400); });

  // ---- sound ----
  var ac=null;
  function primeAudio(){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==="suspended")ac.resume(); }catch(e){} }
  function beep(){
    if(!ac) return;
    try{
      [0,0.18,0.36].forEach(function(t){
        var o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
        o.type="sine";o.frequency.value=880;
        g.gain.setValueAtTime(0.0001,ac.currentTime+t);
        g.gain.exponentialRampToValueAtTime(0.3,ac.currentTime+t+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+t+0.14);
        o.start(ac.currentTime+t);o.stop(ac.currentTime+t+0.16);
      });
    }catch(e){}
  }

  // ---- fullscreen and wake lock ----
  var fsBtn=$("fsBtn"), root=document.documentElement;
  if(!root.requestFullscreen) fsBtn.style.display="none";
  fsBtn.addEventListener("click",function(){ root.requestFullscreen().catch(function(){}); });
  var lock=null;
  function keepAwake(){
    if(!("wakeLock" in navigator)||document.hidden||lock) return;
    navigator.wakeLock.request("screen").then(function(l){
      lock=l; awake=true; paintConn();
      l.addEventListener("release",function(){ lock=null; awake=false; paintConn(); });
    },function(){});
  }
  document.addEventListener("visibilitychange",keepAwake);
  // Browsers only allow sound (and sometimes the wake lock) after a tap, so any click turns both on.
  document.addEventListener("click",function(){ primeAudio(); keepAwake(); paintConn(); });
  keepAwake();

  // ---- controls on this screen: for a night with no internet, or no phone handy ----
  var panel=$("ctlPanel"), frame=null;
  $("ctlBtn").addEventListener("click",function(){
    if(!frame){
      frame=document.createElement("iframe"); frame.title="Controls";
      frame.src="remote.html?room="+encodeURIComponent(room);
      panel.appendChild(frame);
    }
    panel.classList.add("on");
  });
  $("ctlClose").addEventListener("click",function(){ panel.classList.remove("on"); });

  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});
  render(); paintConn();
})();
</script>
</body>
</html>
